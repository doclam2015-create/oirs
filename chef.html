<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="apple-touch-icon" href="icon-chef-180.png">
<link rel="icon" href="icon-chef.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chef">
<meta name="theme-color" content="#123a63">
<title>Chef saludable</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:16px 16px 40px; font-family:-apple-system,system-ui,sans-serif; background:#f2f4f7; color:#1c2430; font-size:16px; }
  h1 { font-size:19px; margin:0 0 4px; color:#123a63; }
  p.sub { margin:0 0 10px; font-size:13px; color:#5a6a7c; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 5px; color:#3a4756; }
  input, textarea, select { width:100%; padding:11px; font-size:16px; font-family:inherit; border:1px solid #c3ccd6; border-radius:8px; background:#fff; color:#1c2430; }
  textarea { min-height:110px; resize:vertical; -webkit-overflow-scrolling:touch; }
  button { width:100%; min-height:48px; margin-top:12px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:#123a63; color:#fff; }
  button:active { background:#0b2743; }
  button.sec { background:#5a6a7c; }
  button.sec:active { background:#43505e; }
  .msg { margin-top:12px; padding:10px; border-radius:8px; font-size:14px; display:none; }
  .msg.err { background:#fde8e8; color:#8c1c1c; display:block; }
  .msg.ok  { background:#e5f4e8; color:#1c5c2c; display:block; }
  .nota { margin-top:10px; font-size:12.5px; color:#5a6a7c; line-height:1.5; }
  #vista { margin-top:14px; padding:12px; background:#fff; border:1px solid #c3ccd6; border-radius:10px;
           font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.45; white-space:pre-wrap;
           max-height:260px; overflow:auto; -webkit-overflow-scrolling:touch; display:none; }
  .chk { display:flex; align-items:center; gap:9px; margin-top:14px; font-size:14px; color:#3a4756; }
  .chk input { width:22px; height:22px; }
  .fila { display:flex; gap:8px; }
  .fila > div { flex:1; }
  details { margin-top:20px; font-size:13px; color:#5a6a7c; }
</style>
</head>
<body>

<h1>Chef saludable</h1>
<p class="sub">Recetas sin lactosa, bajas en hidratos y sin ultraprocesados, con tiempos y conservación.</p>

<label>Qué quieres cocinar</label>
<textarea id="plato" placeholder="Un plato concreto (ej: lasaña, brownie, pan) o un antojo (ej: algo dulce para la tarde). Si quieres que te sugiera, escribe: sugiéreme"></textarea>

<div class="fila">
  <div>
    <label>Tipo</label>
    <select id="tipo">
      <option>Cualquiera</option><option>Salada</option><option>Dulce</option>
    </select>
  </div>
  <div>
    <label>Para cuántas personas</label>
    <input type="text" id="personas" value="2">
  </div>
</div>

<div class="fila">
  <div>
    <label>Cuántas recetas</label>
    <select id="cuantas">
      <option>1</option><option selected>3</option><option>5</option>
    </select>
  </div>
  <div>
    <label>Tiempo disponible</label>
    <select id="tiempo">
      <option>Sin apuro</option><option>Menos de 30 minutos</option><option>Menos de 1 hora</option>
    </select>
  </div>
</div>

<label>Restricciones</label>
<div class="chk"><input type="checkbox" id="rGluten" checked><label for="rGluten" style="margin:0; font-weight:400">Sin gluten</label></div>
<div class="chk"><input type="checkbox" id="rLactosa" checked><label for="rLactosa" style="margin:0; font-weight:400">Sin lactosa</label></div>
<div class="chk"><input type="checkbox" id="rCarbo" checked><label for="rCarbo" style="margin:0; font-weight:400">Baja en hidratos de carbono</label></div>
<div class="chk"><input type="checkbox" id="rVeg" checked><label for="rVeg" style="margin:0; font-weight:400">Sin bebidas vegetales</label></div>

<label>Con qué la quieres hacer</label>
<select id="utensilio">
  <option>El que sea mejor para la receta</option>
  <option>Freidora de aire</option>
  <option>Horno</option>
  <option>Sin horno ni freidora</option>
</select>

<label>Para cuántos días debe durar</label>
<select id="dias">
  <option>Se come el mismo día</option>
  <option selected>2 o 3 días</option>
  <option>Toda la semana</option>
  <option>Para congelar</option>
</select>

<label>Ingredientes que tienes o que quieres usar <span style="font-weight:400">(opcional)</span></label>
<input type="text" id="tengo" placeholder="Ej: pollo, zapallo italiano, huevos, harina de almendras">

<label>Lo que no quieres <span style="font-weight:400">(opcional)</span></label>
<input type="text" id="nada" placeholder="Alergias, cosas que no te gustan, ingredientes caros o difíciles de encontrar">

<button id="copiar">Copiar y abrir el chat</button>
<button id="soloCopiar" class="sec">Solo copiar</button>
<button id="ver" class="sec">Ver texto</button>
<div id="msg" class="msg"></div>
<div id="vista"></div>

<details>
  <summary>Instrucciones para la IA</summary>
  <textarea id="instrTxt" style="min-height:300px; font-family:ui-monospace,Menlo,monospace; font-size:13px"></textarea>
  <button class="sec" id="guardarInstr">Guardar instrucciones</button>
  <button class="sec" id="restaurarInstr">Restaurar las originales</button>
</details>

<details>
  <summary>Configuración</summary>
  <label>Chat que se abre al copiar</label>
  <select id="destino">
    <option value="https://chatgpt.com/">ChatGPT</option>
    <option value="https://gemini.google.com/app">Gemini</option>
    <option value="https://claude.ai/new">Claude</option>
  </select>
  <div class="chk"><input type="checkbox" id="nativa"><label for="nativa" style="margin:0; font-weight:400">Abrir la app instalada en vez del navegador</label></div>
  <input type="text" id="esquema" placeholder="esquema de la app, ej: chatgpt://">
  <p class="sub" style="margin-top:8px">Con esto se abre la app donde ya iniciaste sesión. Si no está instalada o el esquema no es el correcto, cae sola al sitio web pasado un segundo y medio.</p>
</details>

<script>
const K = { dest:'doclam_inf_destino', instr:'doclam_chef_instr' };
const $ = id => document.getElementById(id);
const msg = (t, cls) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + cls; };

// ponytail: localStorage lanza SecurityError en contextos sandbox/privados
const mem = {};
const get = k => { try { const v = localStorage.getItem(k); return v !== null ? v : (mem[k] || ''); } catch (e) { return mem[k] || ''; } };
const set = (k, v) => { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} };
const borrar = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };

const METODO = `Antes de escribir, trabaja el caso por dentro con los seis sombreros y con estos cinco pasos: entender cuál es la pregunta real, analizar los factores en juego, razonar cómo se conectan, sintetizar lo relevante y concluir. No rotules nada de esto en la respuesta.`;

const val = (id, et) => { const v = $(id).value.trim(); return v ? et + ': ' + v : ''; };

const INSTR = `Actúa como chef profesional especializado en cocina saludable y, a la vez, como nutricionista. Cocinas en Chile: propón solo ingredientes que se consigan acá, en supermercado o feria, y usa los nombres chilenos (zapallo italiano, palta, betarraga, choclo, porotos verdes).

Tono práctico. La receta se lee mientras se cocina: pasos numerados, cortos, con la cantidad dentro del paso.

QUÉ SIGNIFICA CADA RESTRICCIÓN, PORQUE AQUÍ SE EQUIVOCAN CASI TODOS
- Sin lactosa no es sin lácteos. La mantequilla, el ghee, la crema, los quesos maduros (parmesano, gouda, cheddar añejo) y el yogur griego colado tienen muy poca lactosa y son perfectamente usables. Esto importa porque son justo lo que da textura y sabor cuando no hay harina. Si la persona además no tolera la caseína, es otra cosa: dilo y ofrece la alternativa.
- Baja en hidratos no es cero. Da los gramos de hidratos netos por porción, siempre, para cada receta. Sin ese número la receta no se puede evaluar. Marca cuando el cálculo sea estimado, que es casi siempre.
- Sin ultraprocesados: ingredientes de un solo componente o con procesamiento simple. Harina de almendras, psyllium, coco rallado, cacao amargo y huevos entran. Cualquier cosa con emulsionantes, gomas, saborizantes o "preparado para" queda fuera. Si un ingrediente que propones está en el límite, dilo tú antes de que te lo pregunte, y explica por qué lo consideras aceptable o cómo reemplazarlo.
- Sin bebidas vegetales: nada de leche de almendras, de coco de cartón, de avena ni similares. Esto quita el líquido que usan casi todas las recetas bajas en hidratos, así que resuélvelo con agua, caldo, crema sin lactosa, huevo o puré de verdura, y dilo explícitamente.

QUE QUEDE COMO EL PLATO ORIGINAL
Ese es el punto y es lo difícil. Cuando quitas harina, azúcar y leche, se pierden tres cosas concretas: estructura, dorado y humedad. Por cada receta, di qué reemplaza cada una y en qué proporción. No entregues una receta que "es parecida": ajusta las cantidades para que la textura de verdad se acerque, y si algo no va a quedar igual, dilo en una línea honesta en vez de prometer que no se nota la diferencia.
Advierte de los defectos típicos de estas masas: que quedan arenosas, que se desarman en frío, que amargan si llevan mucho edulcorante, que la harina de almendras se dora mucho antes que la de trigo.

TIEMPOS Y TEMPERATURAS
Da temperatura exacta en grados Celsius y tiempo en minutos, y además la señal para saber que está listo sin cronómetro: color, olor, que el palillo salga seco, que los bordes se despeguen.
La freidora de aire no es un horno chico: cocina más rápido y por convección. Cuando conviertas una receta de horno, baja unos 20 °C y empieza a revisar bastante antes. Dilo en la receta, no como nota al pie.
Advierte de lo que se quema rápido: la harina de almendras y el coco se doran mucho antes que la harina normal.

CONSERVACIÓN
Por cada receta: cuántos días dura, en qué envase, refrigerada o congelada, y si se congela en porciones. Si va al refrigerador, di si mejora o empeora al segundo día.
Si se come caliente, di cómo recalentarla sin arruinar la textura: temperatura, tiempo, con o sin tapa, y qué no hacer. El microondas ablanda todo lo que estaba crocante: si es el caso, dilo y da la alternativa.

POR CADA RECETA, EN ESTE ORDEN
1. Nombre y en una línea qué es y a qué se parece.
2. Rinde: cuántas porciones y de qué tamaño.
3. Tiempo de preparación y de cocción.
4. Ingredientes en gramos, con la equivalencia en tazas o cucharadas cuando sirva. Nada de "un poco" ni "al gusto" en lo que afecte la textura.
5. Preparación en pasos numerados, con temperatura y tiempo dentro del paso.
6. Cómo saber que está en su punto.
7. Por porción: calorías, hidratos netos, proteína y grasa. Aproximados, y dicho que son aproximados.
8. Conservación y recalentado.
9. El error que arruina esta receta, y cómo evitarlo.

NO INVENTES
No inventes valores nutricionales con decimales falsos: da rangos y di que son estimados.
No propongas un ingrediente que no se consiga en Chile sin decir por qué puede costar encontrarlo y cuál es el reemplazo.
Si lo que te piden no se puede hacer cumpliendo todas las restricciones, dilo derecho y propone lo más cercano que sí se puede, explicando qué restricción tuviste que ceder.

` + METODO;

function instrDefault() { return INSTR; }

function armar() {
  const p = $('plato').value.trim();
  if (p.length < 3) { msg('Dime qué quieres cocinar, o escribe: sugiéreme.', 'err'); return ''; }

  const r = [];
  if ($('rLactosa').checked) r.push('sin lactosa (los lácteos naturalmente bajos en lactosa sí se pueden usar)');
  if ($('rCarbo').checked) r.push('baja en hidratos de carbono, con los gramos netos por porción declarados');
  if ($('rGluten').checked) r.push('sin gluten');
  r.push('sin alimentos ultraprocesados');
  if ($('rVeg').checked) r.push('sin bebidas vegetales de ningún tipo');

  const campos = [
    'QUIERO COCINAR: ' + p,
    $('tipo').value !== 'Cualquiera' ? 'TIPO: receta ' + $('tipo').value.toLowerCase() : '',
    'CUÁNTAS RECETAS: ' + $('cuantas').value,
    'PARA: ' + ($('personas').value.trim() || '2') + ' personas. Ajusta todas las cantidades a ese número.',
    'RESTRICCIONES:\n- ' + r.join('\n- '),
    'TIEMPO: ' + $('tiempo').value,
    'UTENSILIO: ' + $('utensilio').value,
    'UTENSILIOS QUE TENGO: freidora de aire, horno, mezcladora, procesador y triturador, batidora, balanza de cocina, medidores de tazas y cucharadas, moldes de silicona, bolsas y utensilios varios.',
    'DEBE DURAR: ' + $('dias').value + '. Dime cómo guardarla para eso y hasta cuándo se puede comer.',
    val('tengo', 'INGREDIENTES QUE TENGO O QUIERO USAR'),
    val('nada', 'NO QUIERO')
  ].filter(Boolean);
  return $('instrTxt').value.trim() + '\n\n---\n\n' + campos.join('\n\n');
}

const ESQUEMAS = { 'chatgpt.com':'chatgpt://', 'gemini.google.com':'googlegemini://', 'claude.ai':'claude://' };
const K_NAT = 'doclam_ia_nativa', K_ESQ = 'doclam_ia_esquema';

function esquemaDe(url) {
  const g = get(K_ESQ);
  if (g) { try { return (JSON.parse(g) || {})[new URL(url).hostname] || ''; } catch (e) {} }
  return ESQUEMAS[new URL(url).hostname] || '';
}

function pintarEsquema() { $('esquema').value = esquemaDe($('destino').value); }

function guardarEsquema() {
  let m = {}; try { m = JSON.parse(get(K_ESQ) || '{}'); } catch (e) {}
  m[new URL($('destino').value).hostname] = $('esquema').value.trim();
  set(K_ESQ, JSON.stringify(m));
}

// abre la app nativa y, si no responde, cae al sitio web
function abrir() {
  const web = $('destino').value, esq = $('esquema').value.trim();
  if (!$('nativa').checked || !esq) { window.location.href = web; return; }
  const t = setTimeout(() => { if (!document.hidden) window.location.href = web; }, 1500);
  document.addEventListener('visibilitychange', () => clearTimeout(t), { once:true });
  window.location.href = esq;
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    // ponytail: fallback para WebKit sin clipboard API
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, texto.length);
    document.execCommand('copy'); document.body.removeChild(ta);
  }
}

$('destino').value = get(K.dest) || 'https://chatgpt.com/';
$('instrTxt').value = get(K.instr) || instrDefault();


$('destino').addEventListener('change', () => { set(K.dest, $('destino').value); pintarEsquema(); msg('Destino guardado.', 'ok'); });
$('guardarInstr').addEventListener('click', () => { set(K.instr, $('instrTxt').value); msg('Instrucciones guardadas.', 'ok'); });
$('restaurarInstr').addEventListener('click', () => { borrar(K.instr); $('instrTxt').value = instrDefault(); msg('Instrucciones restauradas.', 'ok'); });

$('nativa').checked = get(K_NAT) === '1';
pintarEsquema();
$('nativa').addEventListener('change', () => { set(K_NAT, $('nativa').checked ? '1' : '0'); });
$('esquema').addEventListener('change', guardarEsquema);

['click','touchend'].forEach(ev => {
  $('copiar').addEventListener(ev, async e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    await copiar(t); msg('Copiado. Pega el texto en el chat y envía.', 'ok');
    abrir();
  }, { passive:false });

  $('soloCopiar').addEventListener(ev, async e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    await copiar(t); msg('Copiado al portapapeles.', 'ok');
  }, { passive:false });

  $('ver').addEventListener(ev, e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    $('vista').textContent = t; $('vista').style.display = 'block';
    msg('Vista previa del texto a pegar.', 'ok');
  }, { passive:false });
});


</script>
</body>
</html>
