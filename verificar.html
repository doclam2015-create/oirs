<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="apple-touch-icon" href="icon-verificar-180.png">
<link rel="icon" href="icon-verificar.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verificar">
<meta name="theme-color" content="#123a63">
<title>Verificación de antecedentes</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:16px 16px 40px; font-family:-apple-system,system-ui,sans-serif; background:#f2f4f7; color:#1c2430; font-size:16px; }
  h1 { font-size:19px; margin:0 0 4px; color:#123a63; }
  p.sub { margin:0 0 10px; font-size:13px; color:#5a6a7c; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 5px; color:#3a4756; }
  input, textarea, select { width:100%; padding:11px; font-size:16px; font-family:inherit; border:1px solid #c3ccd6; border-radius:8px; background:#fff; color:#1c2430; }
  textarea { min-height:110px; resize:vertical; -webkit-overflow-scrolling:touch; }
  button { width:100%; min-height:48px; margin-top:12px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:#123a63; color:#fff; }
  button:active { background:#0b2743; }
  button.sec { background:#5a6a7c; }
  button.sec:active { background:#43505e; }
  .msg { margin-top:12px; padding:10px; border-radius:8px; font-size:14px; display:none; }
  .msg.err { background:#fde8e8; color:#8c1c1c; display:block; }
  .msg.ok  { background:#e5f4e8; color:#1c5c2c; display:block; }
  .nota { margin-top:10px; font-size:12.5px; color:#5a6a7c; line-height:1.5; }
  #vista { margin-top:14px; padding:12px; background:#fff; border:1px solid #c3ccd6; border-radius:10px;
           font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.45; white-space:pre-wrap;
           max-height:260px; overflow:auto; -webkit-overflow-scrolling:touch; display:none; }
  .chk { display:flex; align-items:center; gap:9px; margin-top:14px; font-size:14px; color:#3a4756; }
  .chk input { width:22px; height:22px; }
  .fila { display:flex; gap:8px; }
  .fila > div { flex:1; }
  details { margin-top:20px; font-size:13px; color:#5a6a7c; }
</style>
</head>
<body>

<h1>Verificación de antecedentes</h1>
<p class="sub">Credenciales, títulos y empresas, solo en registros públicos oficiales.</p>

<label>Qué necesitas verificar</label>
<select id="tipo">
  <option value="prof">Credenciales de un profesional de la salud</option>
  <option value="titulo">Título o grado académico</option>
  <option value="empresa">Una empresa o un proveedor</option>
  <option value="acad">Publicaciones y trayectoria académica</option>
</select>
<p class="nota" id="notaTipo"></p>

<label id="lblNombre">Nombre completo</label>
<input type="text" id="nombre" placeholder="Como aparece en el documento que tienes a la vista">

<label>Datos que acotan la búsqueda <span style="font-weight:400">(importante)</span></label>
<textarea id="acota" style="min-height:80px" placeholder="Especialidad, universidad, año de titulación, región, RUT de la empresa, cargo declarado. Sin esto, un homónimo se confunde con la persona que buscas."></textarea>

<label>Para qué lo necesitas</label>
<select id="motivo">
  <option>Verificar antecedentes antes de una contratación</option>
  <option>Confirmar que un título o registro es real</option>
  <option>Evaluar un proveedor antes de contratar</option>
  <option>Confirmar la autoría de una publicación</option>
</select>

<button id="copiar">Copiar y abrir el chat</button>
<button id="soloCopiar" class="sec">Solo copiar</button>
<button id="ver" class="sec">Ver texto</button>
<div id="msg" class="msg"></div>
<div id="vista"></div>

<details>
  <summary>Instrucciones para la IA</summary>
  <textarea id="instrTxt" style="min-height:300px; font-family:ui-monospace,Menlo,monospace; font-size:13px"></textarea>
  <button class="sec" id="guardarInstr">Guardar instrucciones</button>
  <button class="sec" id="restaurarInstr">Restaurar las originales</button>
</details>

<details>
  <summary>Configuración</summary>
  <label>Chat que se abre al copiar</label>
  <select id="destino">
    <option value="https://chatgpt.com/">ChatGPT</option>
    <option value="https://gemini.google.com/app">Gemini</option>
    <option value="https://claude.ai/new">Claude</option>
  </select>
  <div class="chk"><input type="checkbox" id="nativa"><label for="nativa" style="margin:0; font-weight:400">Abrir la app instalada en vez del navegador</label></div>
  <input type="text" id="esquema" placeholder="esquema de la app, ej: chatgpt://">
  <p class="sub" style="margin-top:8px">Con esto se abre la app donde ya iniciaste sesión. Si no está instalada o el esquema no es el correcto, cae sola al sitio web pasado un segundo y medio.</p>
</details>

<script>
const K = { dest:'doclam_inf_destino', instr:'doclam_ver_instr' };
const $ = id => document.getElementById(id);
const msg = (t, cls) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + cls; };

// ponytail: localStorage lanza SecurityError en contextos sandbox/privados
const mem = {};
const get = k => { try { const v = localStorage.getItem(k); return v !== null ? v : (mem[k] || ''); } catch (e) { return mem[k] || ''; } };
const set = (k, v) => { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} };
const borrar = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };

const METODO = `Antes de escribir, trabaja el caso por dentro con los seis sombreros y con estos cinco pasos: entender cuál es la pregunta real, analizar los factores en juego, razonar cómo se conectan, sintetizar lo relevante y concluir. No rotules nada de esto en la respuesta.`;

const val = (id, et) => { const v = $(id).value.trim(); return v ? et + ': ' + v : ''; };

const INSTR = `Actúa como verificador de antecedentes profesionales e institucionales en Chile. Trabajas solo con registros públicos oficiales.

QUÉ FUENTES USAS, Y SOLO ESTAS
- Superintendencia de Salud: Registro Nacional de Prestadores Individuales de Salud. Es la fuente que dice si alguien está habilitado para ejercer y con qué especialidad certificada.
- CONACEM y las sociedades científicas, para certificación de especialidad.
- Registros de títulos: Mi Educación Superior del Mineduc, y el registro de la universidad emisora.
- Registro de Empresas y Sociedades, Diario Oficial, SII y Mercado Público, para empresas y proveedores.
- Poder Judicial, solo causas públicas y solo cuando el encargo es evaluar un proveedor o una institución.
- Bases académicas públicas: PubMed, SciELO, Google Scholar, ORCID.
- Colegios profesionales y sus registros de miembros.

LO QUE NO HACES
No perfilas personas. No reúnes vida privada, domicilio, familia, situación económica, fotos, ni actividad en redes sociales. Si lo que se pide es armar el perfil de una persona en vez de verificar una credencial concreta, dilo y no lo hagas.
No entras a nada que requiera credenciales, ni a bases restringidas, ni a datos filtrados.
No busques a personas que no tengan una relación profesional o contractual con quien consulta.
Si el encargo cruza ese límite, dilo en la primera línea y ofrece la versión acotada que sí corresponde.

EL ERROR QUE MÁS SE COMETE: LOS HOMÓNIMOS
En Chile hay muchísimas personas con el mismo nombre y apellido. Confundir a dos es el modo típico de fallar, y el daño es grave: se le atribuye a alguien un antecedente que no es suyo.
Por eso:
1. Cada resultado va con el criterio que te permitió identificarlo: especialidad, año de titulación, universidad, región, número de registro.
2. Si no puedes confirmar que el resultado corresponde a la persona buscada, dilo explícitamente: "coincidencia de nombre, identidad no confirmada". Nunca lo presentes como si fuera la misma persona.
3. Si aparecen varias personas posibles, muéstralas todas y di qué dato haría falta para distinguirlas.

CÓMO PRESENTAS LO QUE ENCUENTRAS
Separa siempre tres cosas, y no las mezcles nunca:
- CONFIRMADO: aparece en un registro oficial, con el enlace y la fecha de consulta.
- NO CONFIRMADO: lo encontraste en una fuente no oficial, o no pudiste verificar la identidad.
- NO ENCONTRADO: buscaste y no hay resultado.
"No encontrado" no significa que no exista. Un registro puede estar caído, mal indexado o el nombre puede estar escrito distinto. Dilo así: nunca conviertas una ausencia de resultado en una afirmación negativa sobre alguien.

BÚSQUEDA WEB
Si tienes búsqueda, úsala y cita cada fuente con enlace y fecha. Si no tienes, dilo en la primera línea y limítate a indicar en qué registro debe buscarse cada cosa, con la dirección exacta. Sin búsqueda no entregues resultados: los inventarías.

FORMATO
1. Qué se pidió verificar, en una línea.
2. Tabla: dato · estado (confirmado / no confirmado / no encontrado) · fuente y fecha.
3. Qué falta para cerrar la verificación y dónde se pide.
4. Advertencias, si hay riesgo de homonimia o si algún dato es ambiguo.

` + METODO;

function instrDefault() { return INSTR; }

const NOTAS = {
  prof: 'Superintendencia de Salud, CONACEM y colegios profesionales. Sirve para saber si alguien está habilitado y con qué especialidad.',
  titulo: 'Registro del Mineduc y de la universidad emisora.',
  empresa: 'Registro de Empresas y Sociedades, SII, Mercado Público y Diario Oficial.',
  acad: 'PubMed, SciELO, ORCID y Google Scholar.'
};
const LBL = { prof:'Nombre completo del profesional', titulo:'Nombre completo', empresa:'Nombre o razón social', acad:'Nombre del autor' };

function pintarTipo() {
  $('notaTipo').textContent = NOTAS[$('tipo').value];
  $('lblNombre').textContent = LBL[$('tipo').value];
}

function armar() {
  const n = $('nombre').value.trim();
  if (n.length < 4) { msg('Escribe el nombre a verificar.', 'err'); return ''; }
  const t = $('tipo').value;
  const QUE = {
    prof: 'Verifica si esta persona está inscrita en el Registro Nacional de Prestadores Individuales de Salud, con qué profesión, si tiene especialidad certificada y cuál, y si su inscripción está vigente.',
    titulo: 'Verifica si el título o grado declarado existe y fue emitido por la institución que se indica.',
    empresa: 'Verifica la existencia y el estado de esta empresa: constitución, giro, representante legal, y si tiene antecedentes públicos relevantes como proveedor.',
    acad: 'Verifica las publicaciones y la trayectoria académica atribuidas a esta persona.'
  };
  const campos = [
    'ENCARGO: ' + QUE[t],
    'NOMBRE: ' + n,
    val('acota', 'DATOS QUE ACOTAN LA BÚSQUEDA'),
    'MOTIVO: ' + $('motivo').value,
    $('acota').value.trim() ? '' : 'No entregué datos que acoten la búsqueda. Adviérteme del riesgo de homonimia y dime qué dato necesitas para distinguir entre personas con el mismo nombre.',
    'Limítate a registros públicos oficiales. No reúnas información personal ni actividad en redes sociales.'
  ].filter(Boolean);
  return $('instrTxt').value.trim() + '\n\n---\n\n' + campos.join('\n\n');
}

pintarTipo();
$('tipo').addEventListener('change', pintarTipo);
const ESQUEMAS = { 'chatgpt.com':'chatgpt://', 'gemini.google.com':'googlegemini://', 'claude.ai':'claude://' };
const K_NAT = 'doclam_ia_nativa', K_ESQ = 'doclam_ia_esquema';

function esquemaDe(url) {
  const g = get(K_ESQ);
  if (g) { try { return (JSON.parse(g) || {})[new URL(url).hostname] || ''; } catch (e) {} }
  return ESQUEMAS[new URL(url).hostname] || '';
}

function pintarEsquema() { $('esquema').value = esquemaDe($('destino').value); }

function guardarEsquema() {
  let m = {}; try { m = JSON.parse(get(K_ESQ) || '{}'); } catch (e) {}
  m[new URL($('destino').value).hostname] = $('esquema').value.trim();
  set(K_ESQ, JSON.stringify(m));
}

// abre la app nativa y, si no responde, cae al sitio web
function abrir() {
  const web = $('destino').value, esq = $('esquema').value.trim();
  if (!$('nativa').checked || !esq) { window.location.href = web; return; }
  const t = setTimeout(() => { if (!document.hidden) window.location.href = web; }, 1500);
  document.addEventListener('visibilitychange', () => clearTimeout(t), { once:true });
  window.location.href = esq;
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    // ponytail: fallback para WebKit sin clipboard API
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, texto.length);
    document.execCommand('copy'); document.body.removeChild(ta);
  }
}

$('destino').value = get(K.dest) || 'https://chatgpt.com/';
$('instrTxt').value = get(K.instr) || instrDefault();


$('destino').addEventListener('change', () => { set(K.dest, $('destino').value); pintarEsquema(); msg('Destino guardado.', 'ok'); });
$('guardarInstr').addEventListener('click', () => { set(K.instr, $('instrTxt').value); msg('Instrucciones guardadas.', 'ok'); });
$('restaurarInstr').addEventListener('click', () => { borrar(K.instr); $('instrTxt').value = instrDefault(); msg('Instrucciones restauradas.', 'ok'); });

$('nativa').checked = get(K_NAT) === '1';
pintarEsquema();
$('nativa').addEventListener('change', () => { set(K_NAT, $('nativa').checked ? '1' : '0'); });
$('esquema').addEventListener('change', guardarEsquema);

['click','touchend'].forEach(ev => {
  $('copiar').addEventListener(ev, async e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    await copiar(t); msg('Copiado. Pega el texto en el chat y envía.', 'ok');
    abrir();
  }, { passive:false });

  $('soloCopiar').addEventListener(ev, async e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    await copiar(t); msg('Copiado al portapapeles.', 'ok');
  }, { passive:false });

  $('ver').addEventListener(ev, e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    $('vista').textContent = t; $('vista').style.display = 'block';
    msg('Vista previa del texto a pegar.', 'ok');
  }, { passive:false });
});


</script>
</body>
</html>
