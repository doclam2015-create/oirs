<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="apple-touch-icon" href="icon-verificar-180.png">
<link rel="icon" href="icon-verificar.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verificar">
<meta name="theme-color" content="#123a63">
<title>Verificación de antecedentes</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:16px 16px 40px; font-family:-apple-system,system-ui,sans-serif; background:#f2f4f7; color:#1c2430; font-size:16px; }
  h1 { font-size:19px; margin:0 0 4px; color:#123a63; }
  p.sub { margin:0 0 10px; font-size:13px; color:#5a6a7c; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 5px; color:#3a4756; }
  input, textarea, select { width:100%; padding:11px; font-size:16px; font-family:inherit; border:1px solid #c3ccd6; border-radius:8px; background:#fff; color:#1c2430; }
  textarea { min-height:110px; resize:vertical; -webkit-overflow-scrolling:touch; }
  button { width:100%; min-height:48px; margin-top:12px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:#123a63; color:#fff; }
  button:active { background:#0b2743; }
  button.sec { background:#5a6a7c; }
  button.sec:active { background:#43505e; }
  .msg { margin-top:12px; padding:10px; border-radius:8px; font-size:14px; display:none; }
  .msg.err { background:#fde8e8; color:#8c1c1c; display:block; }
  .msg.ok  { background:#e5f4e8; color:#1c5c2c; display:block; }
  .nota { margin-top:10px; font-size:12.5px; color:#5a6a7c; line-height:1.5; }
  #vista { margin-top:14px; padding:12px; background:#fff; border:1px solid #c3ccd6; border-radius:10px;
           font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.45; white-space:pre-wrap;
           max-height:260px; overflow:auto; -webkit-overflow-scrolling:touch; display:none; }
  .chk { display:flex; align-items:center; gap:9px; margin-top:14px; font-size:14px; color:#3a4756; }
  .chk input { width:22px; height:22px; }
  .fila { display:flex; gap:8px; }
  .fila > div { flex:1; }
  details { margin-top:20px; font-size:13px; color:#5a6a7c; }
</style>
</head>
<body>

<h1>Verificación de antecedentes</h1>
<p class="sub">Personas, empresas y credenciales, solo en registros públicos oficiales.</p>

<label>Qué necesitas</label>
<select id="modo">
  <option value="credencial">Credenciales de un profesional de la salud</option>
  <option value="postulante">Evaluar a un postulante antes de contratarlo</option>
  <option value="empresa">Una empresa o un proveedor</option>
  <option value="defensa">Antecedentes para una defensa institucional</option>
  <option value="contraparte">Una contraparte antes de un trato o contrato</option>
  <option value="acad">Publicaciones y trayectoria académica</option>
</select>
<p class="nota" id="notaModo"></p>

<label id="lblNombre">Nombre completo</label>
<input type="text" id="nombre" placeholder="Como aparece en el documento que tienes a la vista">

<label>Datos que acotan la búsqueda <span style="font-weight:400">(lo más importante del formulario)</span></label>
<textarea id="acota" style="min-height:90px" placeholder="Especialidad, universidad, año de titulación, región, RUT de la empresa, cargo declarado. Sin esto, un homónimo se confunde con la persona que buscas."></textarea>

<label>Contexto: por qué necesitas esto</label>
<textarea id="motivo" style="min-height:70px" placeholder="Ej: postula al cargo de médico de urgencia; es el proveedor que cotizó insumos; es el reclamante de la causa OIRS 123"></textarea>

<div class="chk"><input type="checkbox" id="juris"><label for="juris" style="margin:0; font-weight:400">Incluir causas judiciales públicas</label></div>

<p class="nota" id="avisoLegal"></p>

<button id="copiar">Copiar y abrir el chat</button>
<button id="soloCopiar" class="sec">Solo copiar</button>
<button id="ver" class="sec">Ver texto</button>
<div id="msg" class="msg"></div>
<div id="vista"></div>

<details>
  <summary>Instrucciones para la IA</summary>
  <textarea id="instrTxt" style="min-height:300px; font-family:ui-monospace,Menlo,monospace; font-size:13px"></textarea>
  <button class="sec" id="guardarInstr">Guardar instrucciones</button>
  <button class="sec" id="restaurarInstr">Restaurar las originales</button>
</details>

<details>
  <summary>Configuración</summary>
  <label>Chat que se abre al copiar</label>
  <select id="destino">
    <option value="https://chatgpt.com/">ChatGPT</option>
    <option value="https://gemini.google.com/app">Gemini</option>
    <option value="https://claude.ai/new">Claude</option>
  </select>
  <div class="chk"><input type="checkbox" id="nativa"><label for="nativa" style="margin:0; font-weight:400">Abrir la app instalada en vez del navegador</label></div>
  <input type="text" id="esquema" placeholder="esquema de la app, ej: chatgpt://">
  <p class="sub" style="margin-top:8px">Con esto se abre la app donde ya iniciaste sesión. Si no está instalada o el esquema no es el correcto, cae sola al sitio web pasado un segundo y medio.</p>
</details>

<script>
const K = { dest:'doclam_inf_destino', instr:'doclam_ver_instr' };
const $ = id => document.getElementById(id);
const msg = (t, cls) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + cls; };

// ponytail: localStorage lanza SecurityError en contextos sandbox/privados
const mem = {};
const get = k => { try { const v = localStorage.getItem(k); return v !== null ? v : (mem[k] || ''); } catch (e) { return mem[k] || ''; } };
const set = (k, v) => { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} };
const borrar = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };

const METODO = `Antes de escribir, trabaja el caso por dentro con los seis sombreros y con estos cinco pasos: entender cuál es la pregunta real, analizar los factores en juego, razonar cómo se conectan, sintetizar lo relevante y concluir. No rotules nada de esto en la respuesta.`;

const val = (id, et) => { const v = $(id).value.trim(); return v ? et + ': ' + v : ''; };

const MODOS = {
  credencial: {
    lbl: 'Nombre completo del profesional',
    nota: 'Superintendencia de Salud, CONACEM y colegios profesionales. Para saber si está habilitado y con qué especialidad certificada.',
    aviso: '',
    enc: 'Verifica si esta persona está inscrita en el Registro Nacional de Prestadores Individuales de Salud, con qué profesión, si tiene especialidad certificada y cuál, y si su inscripción está vigente.'
  },
  postulante: {
    lbl: 'Nombre completo del postulante',
    nota: 'Habilitación, título, especialidad, sanciones e inhabilidades. Solo lo que tenga relación con el cargo.',
    aviso: '⚠️ La Ley 19.812 prohíbe condicionar una contratación a que la persona no tenga deudas, y prohíbe exigirle cualquier certificado al respecto. No consultes Dicom ni el Boletín Comercial de un postulante a un cargo clínico: la excepción legal alcanza solo a quienes manejan fondos o representan al empleador.',
    enc: 'Verifica los antecedentes profesionales públicos de esta persona que sean pertinentes al cargo al que postula: habilitación vigente, título, especialidad certificada, sanciones administrativas publicadas, e inhabilidades para ejercer función pública.'
  },
  empresa: {
    lbl: 'Nombre o razón social',
    nota: 'Registro de Empresas y Sociedades, SII, Mercado Público, Diario Oficial, Poder Judicial. Las personas jurídicas no tienen vida privada.',
    aviso: '',
    enc: 'Verifica la existencia, el estado y los antecedentes públicos de esta empresa: constitución, giro, socios y representante legal, situación tributaria pública, comportamiento como proveedor del Estado, sanciones y causas judiciales.'
  },
  defensa: {
    lbl: 'Nombre del reclamante o demandante',
    nota: 'Solo lo pertinente al caso concreto y solo de registros públicos.',
    aviso: '⚠️ Esta búsqueda es sobre alguien que reclama contra tu servicio. Es legítima únicamente para lo pertinente al caso. Buscar su vida privada, su situación económica o sus redes sociales no sirve para la defensa y, si se usa, convierte al servicio en el infractor: la Ley 19.628 y, desde el 1 de diciembre de 2026, la Ley 21.719 obligan a los organismos públicos a tratar datos solo para la finalidad que los justifica.',
    enc: 'Reúne únicamente los antecedentes públicos que sean pertinentes al caso concreto: causas judiciales previas sobre la misma materia, reclamos anteriores que consten en registros públicos, y su calidad para actuar en el procedimiento.'
  },
  contraparte: {
    lbl: 'Nombre o razón social de la contraparte',
    nota: 'Existencia, representación, causas públicas y antecedentes societarios, antes de firmar.',
    aviso: '⚠️ Verificar a quien va a firmar contigo es legítimo. Reunir su vida privada no. Limítate a lo que consta en registros oficiales y a lo que tenga relación con el trato que vas a hacer.',
    enc: 'Verifica los antecedentes públicos de esta contraparte que sean pertinentes antes de celebrar un contrato: identidad y capacidad para obligarse, existencia y vigencia si es persona jurídica, quién la representa, y causas judiciales públicas relacionadas con incumplimientos.'
  },
  acad: {
    lbl: 'Nombre del autor',
    nota: 'PubMed, SciELO, ORCID y Google Scholar.',
    aviso: '',
    enc: 'Verifica las publicaciones y la trayectoria académica atribuidas a esta persona.'
  }
};

const INSTR = `Actúa como verificador de antecedentes en Chile. Trabajas solo con registros públicos oficiales y con fuentes verificables, y solo respondes lo que se te encargó verificar.

FUENTES QUE USAS
- Superintendencia de Salud: Registro Nacional de Prestadores Individuales de Salud, y sus resoluciones sancionatorias publicadas.
- CONACEM y las sociedades científicas, para certificación de especialidad.
- Mi Educación Superior del Mineduc y los registros de las universidades, para títulos y grados.
- Registro de Empresas y Sociedades, SII, Mercado Público y Diario Oficial, para personas jurídicas.
- Poder Judicial: causas públicas.
- Contraloría: dictámenes, y registro de inhabilidades para la función pública.
- Bases académicas públicas: PubMed, SciELO, ORCID, Google Scholar.
- Colegios profesionales y sus registros de miembros.
- Prensa, solo de medios identificables, y siempre marcada como fuente no oficial.

DOS LÍMITES LEGALES QUE DEBES APLICAR SIN QUE TE LOS PIDAN
1. Ley 19.812: ningún empleador puede condicionar una contratación a que la persona no tenga deudas económicas, financieras, bancarias o comerciales, ni exigirle certificado alguno sobre eso. La excepción alcanza solo a quienes representan al empleador con facultades generales de administración o manejan fondos o valores. Si el encargo es evaluar a un postulante a un cargo clínico y te piden su situación de deudas, niégate y explica por qué.
2. Ley 19.628 y, desde el 1 de diciembre de 2026, Ley 21.719 de protección de datos personales. Los datos se tratan solo para la finalidad que los justifica y solo en la medida necesaria. Un organismo público que reúne más de lo que necesita se convierte él mismo en infractor.

PERTINENCIA: EL FILTRO QUE MANDA
Antes de entregar cada dato, pregúntate si sirve para la finalidad declarada. Si no sirve, no lo pongas, aunque lo hayas encontrado y aunque sea público.
No reúnas vida privada, domicilio, familia, fotografías, actividad en redes sociales, ni situación económica de una persona natural.
Si lo que se te pide es armar el perfil de una persona en vez de verificar algo concreto, dilo y no lo hagas. Ofrece en su lugar la verificación acotada que sí corresponde.

EL ERROR QUE MÁS DAÑO HACE: LOS HOMÓNIMOS
En Chile hay muchísimas personas con el mismo nombre y apellido, y atribuirle a alguien el antecedente de su tocayo puede costarle el trabajo a una persona que no hizo nada.
1. Cada resultado va acompañado del criterio que permitió identificarlo: especialidad, año de titulación, universidad, región, número de registro, RUT si es público.
2. Si no puedes confirmar que el resultado corresponde a la persona buscada, escríbelo así: "coincidencia de nombre, identidad no confirmada". Nunca lo presentes como si fuera la misma persona.
3. Si aparecen varios candidatos, muéstralos todos y di qué dato haría falta para distinguirlos.
4. Cuando el encargo pueda afectar a alguien (una contratación, una defensa, un contrato), la identidad debe estar confirmada antes de afirmar nada en su contra. Sin confirmación, el hallazgo se reporta como pendiente de verificar, no como hecho.

CÓMO PRESENTAS LO QUE ENCUENTRAS
Separa tres categorías y no las mezcles nunca:
- CONFIRMADO: consta en un registro oficial, con enlace y fecha de consulta.
- NO CONFIRMADO: fuente no oficial, o identidad no verificada.
- NO ENCONTRADO: buscaste y no hay resultado.
"No encontrado" no significa que no exista. Un registro puede estar caído, mal indexado, o el nombre escrito distinto. Nunca conviertas una ausencia de resultado en una afirmación negativa sobre alguien.
Una causa judicial iniciada no es una condena, y una condena antigua puede estar cumplida o prescrita. Si reportas una causa, reporta su estado.

BÚSQUEDA WEB
Si tienes búsqueda, úsala y cita cada fuente con enlace y fecha de consulta. Si no tienes, dilo en la primera línea y limítate a indicar en qué registro se busca cada cosa, con la dirección exacta. Sin búsqueda no entregues resultados: los inventarías, y un antecedente inventado sobre una persona es lo más grave que puedes producir.

FORMATO
1. Qué se pidió verificar y con qué finalidad, en una línea.
2. Tabla: dato · estado (confirmado / no confirmado / no encontrado) · fuente y fecha.
3. Qué queda pendiente y dónde se pide.
4. Advertencias: riesgo de homonimia, datos ambiguos, y cualquier cosa del encargo que no correspondía responder.

` + METODO;

function instrDefault() { return INSTR; }

function pintarModo() {
  const m = MODOS[$('modo').value];
  $('notaModo').textContent = m.nota;
  $('lblNombre').textContent = m.lbl;
  $('avisoLegal').textContent = m.aviso;
  $('avisoLegal').style.display = m.aviso ? 'block' : 'none';
}

function armar() {
  const n = $('nombre').value.trim();
  if (n.length < 4) { msg('Escribe el nombre a verificar.', 'err'); return ''; }
  const k = $('modo').value, m = MODOS[k];
  const campos = [
    'ENCARGO: ' + m.enc,
    'NOMBRE: ' + n,
    val('acota', 'DATOS QUE ACOTAN LA BÚSQUEDA'),
    val('motivo', 'CONTEXTO Y FINALIDAD'),
    m.aviso ? 'LÍMITE APLICABLE A ESTE CASO: ' + m.aviso.replace('⚠️ ', '') : '',
    $('juris').checked
      ? 'CAUSAS JUDICIALES: inclúyelas, solo las públicas y solo las pertinentes a la finalidad. Indica el estado de cada una: una causa iniciada no es una condena.'
      : 'CAUSAS JUDICIALES: no las incluyas salvo que sean imprescindibles para la finalidad declarada.',
    $('acota').value.trim() ? '' : 'No entregué datos que acoten la búsqueda. Adviérteme del riesgo de homonimia y dime qué dato necesitas para distinguir entre personas con el mismo nombre antes de afirmar nada.',
    'Limítate a registros públicos oficiales y a lo pertinente a la finalidad. No reúnas vida privada, situación económica de una persona natural, ni actividad en redes sociales.'
  ].filter(Boolean);
  return $('instrTxt').value.trim() + '\n\n---\n\n' + campos.join('\n\n');
}

pintarModo();
$('modo').addEventListener('change', pintarModo);
const ESQUEMAS = { 'chatgpt.com':'chatgpt://', 'gemini.google.com':'googlegemini://', 'claude.ai':'claude://' };
const K_NAT = 'doclam_ia_nativa', K_ESQ = 'doclam_ia_esquema';

function esquemaDe(url) {
  const g = get(K_ESQ);
  if (g) { try { return (JSON.parse(g) || {})[new URL(url).hostname] || ''; } catch (e) {} }
  return ESQUEMAS[new URL(url).hostname] || '';
}

function pintarEsquema() { $('esquema').value = esquemaDe($('destino').value); }

function guardarEsquema() {
  let m = {}; try { m = JSON.parse(get(K_ESQ) || '{}'); } catch (e) {}
  m[new URL($('destino').value).hostname] = $('esquema').value.trim();
  set(K_ESQ, JSON.stringify(m));
}

// abre la app nativa y, si no responde, cae al sitio web
function abrir() {
  const web = $('destino').value, esq = $('esquema').value.trim();
  if (!$('nativa').checked || !esq) { window.location.href = web; return; }
  const t = setTimeout(() => { if (!document.hidden) window.location.href = web; }, 1500);
  document.addEventListener('visibilitychange', () => clearTimeout(t), { once:true });
  window.location.href = esq;
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    // ponytail: fallback para WebKit sin clipboard API
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, texto.length);
    document.execCommand('copy'); document.body.removeChild(ta);
  }
}

$('destino').value = get(K.dest) || 'https://chatgpt.com/';
$('instrTxt').value = get(K.instr) || instrDefault();


$('destino').addEventListener('change', () => { set(K.dest, $('destino').value); pintarEsquema(); msg('Destino guardado.', 'ok'); });
$('guardarInstr').addEventListener('click', () => { set(K.instr, $('instrTxt').value); msg('Instrucciones guardadas.', 'ok'); });
$('restaurarInstr').addEventListener('click', () => { borrar(K.instr); $('instrTxt').value = instrDefault(); msg('Instrucciones restauradas.', 'ok'); });

$('nativa').checked = get(K_NAT) === '1';
pintarEsquema();
$('nativa').addEventListener('change', () => { set(K_NAT, $('nativa').checked ? '1' : '0'); });
$('esquema').addEventListener('change', guardarEsquema);

['click','touchend'].forEach(ev => {
  $('copiar').addEventListener(ev, async e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    await copiar(t); msg('Copiado. Pega el texto en el chat y envía.', 'ok');
    abrir();
  }, { passive:false });

  $('soloCopiar').addEventListener(ev, async e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    await copiar(t); msg('Copiado al portapapeles.', 'ok');
  }, { passive:false });

  $('ver').addEventListener(ev, e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    $('vista').textContent = t; $('vista').style.display = 'block';
    msg('Vista previa del texto a pegar.', 'ok');
  }, { passive:false });
});


</script>
</body>
</html>
