<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="apple-touch-icon" href="icon-ofertas-180.png">
<link rel="icon" href="icon-ofertas.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ofertas">
<meta name="theme-color" content="#123a63">
<title>Buscador de ofertas</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:16px 16px 40px; font-family:-apple-system,system-ui,sans-serif; background:#f2f4f7; color:#1c2430; font-size:16px; }
  h1 { font-size:19px; margin:0 0 4px; color:#123a63; }
  p.sub { margin:0 0 10px; font-size:13px; color:#5a6a7c; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 5px; color:#3a4756; }
  input, textarea, select { width:100%; padding:11px; font-size:16px; font-family:inherit; border:1px solid #c3ccd6; border-radius:8px; background:#fff; color:#1c2430; }
  textarea { min-height:110px; resize:vertical; -webkit-overflow-scrolling:touch; }
  button { width:100%; min-height:48px; margin-top:12px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:#123a63; color:#fff; }
  button:active { background:#0b2743; }
  button.sec { background:#5a6a7c; }
  button.sec:active { background:#43505e; }
  .msg { margin-top:12px; padding:10px; border-radius:8px; font-size:14px; display:none; }
  .msg.err { background:#fde8e8; color:#8c1c1c; display:block; }
  .msg.ok  { background:#e5f4e8; color:#1c5c2c; display:block; }
  .nota { margin-top:10px; font-size:12.5px; color:#5a6a7c; line-height:1.5; }
  #vista { margin-top:14px; padding:12px; background:#fff; border:1px solid #c3ccd6; border-radius:10px;
           font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.45; white-space:pre-wrap;
           max-height:260px; overflow:auto; -webkit-overflow-scrolling:touch; display:none; }
  .chk { display:flex; align-items:center; gap:9px; margin-top:14px; font-size:14px; color:#3a4756; }
  .chk input { width:22px; height:22px; }
  .fila { display:flex; gap:8px; }
  .fila > div { flex:1; }
  details { margin-top:20px; font-size:13px; color:#5a6a7c; }
</style>
</head>
<body>

<h1>Buscador de ofertas</h1>
<p class="sub">Bencina y tarjetas: qué conviene usar hoy, con el ahorro en pesos.</p>

<p class="nota" id="hoy"></p>

<label>Qué revisar hoy</label>
<div class="chk"><input type="checkbox" id="cBencina" checked><label for="cBencina" style="margin:0; font-weight:400">Apps de bencina: Copec, Shell, Aramco</label></div>
<div class="chk"><input type="checkbox" id="cChile" checked><label for="cChile" style="margin:0; font-weight:400">Banco de Chile</label></div>
<div class="chk"><input type="checkbox" id="cItau" checked><label for="cItau" style="margin:0; font-weight:400">Banco Itaú</label></div>
<div class="chk"><input type="checkbox" id="cTenpo" checked><label for="cTenpo" style="margin:0; font-weight:400">Tenpo</label></div>
<div class="chk"><input type="checkbox" id="cDale" checked><label for="cDale" style="margin:0; font-weight:400">Dale de Coopeuch</label></div>
<div class="chk"><input type="checkbox" id="cMach" checked><label for="cMach" style="margin:0; font-weight:400">Mach</label></div>

<label>Otros servicios o rubros <span style="font-weight:400">(opcional)</span></label>
<input type="text" id="otros" placeholder="Ej: supermercados, farmacias, restaurantes, streaming">

<label>Comuna o ciudad</label>
<input type="text" id="comuna" placeholder="Ej: Antofagasta">

<label>En qué vas a gastar hoy <span style="font-weight:400">(opcional, afina la recomendación)</span></label>
<input type="text" id="gasto" placeholder="Ej: cargar 40 litros de 95, compra de supermercado de 60.000">

<button id="copiar">Copiar y abrir el chat</button>
<button id="soloCopiar" class="sec">Solo copiar</button>
<button id="ver" class="sec">Ver texto</button>
<div id="msg" class="msg"></div>
<div id="vista"></div>

<details>
  <summary>Instrucciones para la IA</summary>
  <textarea id="instrTxt" style="min-height:300px; font-family:ui-monospace,Menlo,monospace; font-size:13px"></textarea>
  <button class="sec" id="guardarInstr">Guardar instrucciones</button>
  <button class="sec" id="restaurarInstr">Restaurar las originales</button>
</details>

<details>
  <summary>Configuración</summary>
  <label>Chat que se abre al copiar</label>
  <select id="destino">
    <option value="https://chatgpt.com/">ChatGPT</option>
    <option value="https://gemini.google.com/app">Gemini</option>
    <option value="https://claude.ai/new">Claude</option>
  </select>
  <div class="chk"><input type="checkbox" id="nativa"><label for="nativa" style="margin:0; font-weight:400">Abrir la app instalada en vez del navegador</label></div>
  <input type="text" id="esquema" placeholder="esquema de la app, ej: chatgpt://">
  <p class="sub" style="margin-top:8px">Con esto se abre la app donde ya iniciaste sesión. Si no está instalada o el esquema no es el correcto, cae sola al sitio web pasado un segundo y medio.</p>
</details>

<script>
const K = { dest:'doclam_inf_destino', instr:'doclam_ofe_instr' };
const $ = id => document.getElementById(id);
const msg = (t, cls) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + cls; };

// ponytail: localStorage lanza SecurityError en contextos sandbox/privados
const mem = {};
const get = k => { try { const v = localStorage.getItem(k); return v !== null ? v : (mem[k] || ''); } catch (e) { return mem[k] || ''; } };
const set = (k, v) => { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} };
const borrar = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };

const METODO = `Antes de escribir, trabaja el caso por dentro con los seis sombreros y con estos cinco pasos: entender cuál es la pregunta real, analizar los factores en juego, razonar cómo se conectan, sintetizar lo relevante y concluir. No rotules nada de esto en la respuesta.`;

// La fecha la pone la app: un modelo no sabe qué día es hoy y de eso depende media respuesta.
const HOY = new Date();
const fechaLarga = () => HOY.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

const val = (id, et) => { const v = $(id).value.trim(); return v ? et + ': ' + v : ''; };

const INSTR = `Actúa como especialista en beneficios bancarios y descuentos vigentes en Chile. Tu trabajo es decirme qué me conviene usar hoy, no darme un catálogo.

BÚSQUEDA WEB: OBLIGATORIA
Los beneficios cambian cada mes y muchos aplican solo un día de la semana. Un beneficio recordado de memoria es un beneficio vencido. Si dispones de búsqueda web, úsala siempre en esta consulta, sin esperar a que te lo pidan, y revisa la página de beneficios de cada emisor y de cada app de bencina.
Si no tienes búsqueda disponible, dilo en la primera línea y no listes beneficios: limítate a decirme dónde revisarlos yo mismo, con el enlace de cada uno.

CERO INVENCIÓN
No inventes un descuento, un tope, un día ni un porcentaje. Si de un emisor no obtuviste datos verificables hoy, escribe "no verificado hoy" en esa fila. Una fila vacía es correcta; una fila inventada me hace cargar bencina en la estación equivocada.
Cada beneficio va con el enlace y con la fecha y hora en que lo verificaste.

LO QUE MÁS IMPORTA
La pregunta real no es qué beneficios existen, sino cuál uso hoy. Ordena la respuesta por eso.
- La fecha y el día de la semana van dados más abajo: no los calcules ni los supongas.
- Un beneficio que aplica solo los martes y hoy no es martes, va marcado como "no aplica hoy" y se dice qué día sí.
- Distingue lo que es descuento por litro de lo que es cashback, de lo que es porcentaje sobre el total: no son comparables sin traducirlos a pesos.
- Los topes son lo que decide. Un 20 % con tope de $3.000 vale menos que un 10 % sin tope en una compra grande. Calcula el ahorro real en pesos para el gasto que te indico.
- Muchos beneficios exigen inscripción previa, pago desde la app, o un mínimo de compra. Si es así, dilo: sin eso el descuento no se aplica y el cliente lo descubre en la caja.

FORMATO DE SALIDA
Una tabla, una fila por servicio o tarjeta, con estas columnas:
Servicio o tarjeta · ¿Aplica hoy? · Tipo de beneficio · Cuánto ahorro en pesos para mi gasto · Condiciones y topes · Requiere inscripción · Enlace

Después de la tabla:
1. LA MEJOR OPCIÓN DE HOY: una sola, con el ahorro estimado en pesos y por qué gana.
2. Si hay una combinación mejor que cualquier opción sola (pagar con una tarjeta dentro de una app específica), dila.
3. RECORDATORIO DEL DÍA: tres o cuatro líneas, lo más importante, escrito para leerse de un vistazo antes de salir de casa. Incluye lo que hay que hacer antes de pagar.
4. Fuentes con fecha y hora de verificación.

` + METODO;

function instrDefault() { return INSTR; }

function armar() {
  const sel = [];
  if ($('cBencina').checked) sel.push('Apps de bencina: Copec (Copec App / Copec Pay), Shell (Shell Box) y Aramco');
  if ($('cChile').checked) sel.push('Banco de Chile: tarjetas de débito y crédito');
  if ($('cItau').checked) sel.push('Banco Itaú: tarjetas de débito y crédito');
  if ($('cTenpo').checked) sel.push('Tenpo');
  if ($('cDale').checked) sel.push('Dale de Coopeuch');
  if ($('cMach').checked) sel.push('Mach');
  const otros = $('otros').value.trim();
  if (otros) sel.push('Además: ' + otros);
  if (!sel.length) { msg('Elige al menos un servicio.', 'err'); return ''; }

  const campos = [
    'FECHA DE HOY: ' + fechaLarga() + '. Este es el día real: úsalo para decidir qué aplica y qué no, y no lo recalcules.',
    'REVISAR:\n- ' + sel.join('\n- '),
    'UBICACIÓN: ' + ($('comuna').value.trim() || 'Chile, comuna sin especificar') + '. Varios beneficios son regionales: si no puedes confirmar que aplica acá, dilo.',
    val('gasto', 'GASTO PREVISTO PARA HOY'),
    'Si un beneficio no lo pudiste verificar hoy, escríbelo como no verificado en vez de estimarlo.'
  ].filter(Boolean);
  return $('instrTxt').value.trim() + '\n\n---\n\n' + campos.join('\n\n');
}

$('hoy').textContent = 'Hoy es ' + fechaLarga() + '. La fecha va dentro del texto para que la IA no la adivine.';

const ESQUEMAS = { 'chatgpt.com':'chatgpt://', 'gemini.google.com':'googlegemini://', 'claude.ai':'claude://' };
const K_NAT = 'doclam_ia_nativa', K_ESQ = 'doclam_ia_esquema';

function esquemaDe(url) {
  const g = get(K_ESQ);
  if (g) { try { return (JSON.parse(g) || {})[new URL(url).hostname] || ''; } catch (e) {} }
  return ESQUEMAS[new URL(url).hostname] || '';
}

function pintarEsquema() { $('esquema').value = esquemaDe($('destino').value); }

function guardarEsquema() {
  let m = {}; try { m = JSON.parse(get(K_ESQ) || '{}'); } catch (e) {}
  m[new URL($('destino').value).hostname] = $('esquema').value.trim();
  set(K_ESQ, JSON.stringify(m));
}

// abre la app nativa y, si no responde, cae al sitio web
function abrir() {
  const web = $('destino').value, esq = $('esquema').value.trim();
  if (!$('nativa').checked || !esq) { window.location.href = web; return; }
  const t = setTimeout(() => { if (!document.hidden) window.location.href = web; }, 1500);
  document.addEventListener('visibilitychange', () => clearTimeout(t), { once:true });
  window.location.href = esq;
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    // ponytail: fallback para WebKit sin clipboard API
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, texto.length);
    document.execCommand('copy'); document.body.removeChild(ta);
  }
}

$('destino').value = get(K.dest) || 'https://chatgpt.com/';
$('instrTxt').value = get(K.instr) || instrDefault();


$('destino').addEventListener('change', () => { set(K.dest, $('destino').value); pintarEsquema(); msg('Destino guardado.', 'ok'); });
$('guardarInstr').addEventListener('click', () => { set(K.instr, $('instrTxt').value); msg('Instrucciones guardadas.', 'ok'); });
$('restaurarInstr').addEventListener('click', () => { borrar(K.instr); $('instrTxt').value = instrDefault(); msg('Instrucciones restauradas.', 'ok'); });

$('nativa').checked = get(K_NAT) === '1';
pintarEsquema();
$('nativa').addEventListener('change', () => { set(K_NAT, $('nativa').checked ? '1' : '0'); });
$('esquema').addEventListener('change', guardarEsquema);

['click','touchend'].forEach(ev => {
  $('copiar').addEventListener(ev, async e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    await copiar(t); msg('Copiado. Pega el texto en el chat y envía.', 'ok');
    abrir();
  }, { passive:false });

  $('soloCopiar').addEventListener(ev, async e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    await copiar(t); msg('Copiado al portapapeles.', 'ok');
  }, { passive:false });

  $('ver').addEventListener(ev, e => {
    e.preventDefault(); const t = armar(); if (!t) return;
    $('vista').textContent = t; $('vista').style.display = 'block';
    msg('Vista previa del texto a pegar.', 'ok');
  }, { passive:false });
});


</script>
</body>
</html>
